services:
  app:
    build: .
    profiles: ["full"]
    environment:
      DATABASE_URL: postgresql://cinora:cinora_dev@postgres:5432/cinora
      REDIS_URL: redis://redis:6379
      NUXT_PUBLIC_CONTENT_MODE: database
      NUXT_ADMIN_PASSWORD: ${NUXT_ADMIN_PASSWORD:-change-me-locally}
      NUXT_ADMIN_SESSION_SECRET: ${NUXT_ADMIN_SESSION_SECRET:-local-secret-change-me-32-characters-minimum}
      NUXT_PLAYBACK_API_BASE: ${NUXT_PLAYBACK_API_BASE:-}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_FROM: CINORA <noreply@cinora.local>
    ports: ["3000:3000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      mailpit: { condition: service_started }
    command: ["sh", "-c", "node scripts/database.mjs setup && node .output/server/index.mjs"]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cinora
      POSTGRES_USER: cinora
      POSTGRES_PASSWORD: cinora_dev
    ports: ["5432:5432"]
    volumes: ["cinora_postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinora -d cinora"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports: ["6379:6379"]
    volumes: ["cinora_redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.21
    ports: ["1025:1025", "8025:8025"]

  adminer:
    image: adminer:4
    profiles: ["tools"]
    ports: ["8080:8080"]
    depends_on: [postgres]

  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["monitoring"]
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes: ["./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.2.0
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: cinora_grafana
    ports: ["3005:3000"]
    volumes: ["cinora_grafana:/var/lib/grafana"]
    depends_on: [prometheus]

volumes:
  cinora_postgres:
  cinora_redis:
  cinora_grafana:
